name: Compilar APKs Rota Lanches 0.2.1
on:
  push:
    branches: [rota-lanches-apks-2026-11-10]
  workflow_dispatch:

jobs:
  testes-servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q rota-lanches-projeto-testado-v0.2.1.zip -d projeto
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar gerador de QR e testar 20 entregas
        working-directory: projeto/server
        run: |
          npm install --no-audit --no-fund
          npm test
          node -e "require('qrcode').toString('RL1:0123456789abcdef0123456789abcdef0123456789abcdef',{type:'svg'}).then(v=>{if(!v.includes('<svg'))process.exit(2);console.log('QR SVG: OK')})"

  compilar:
    needs: testes-servidor
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [Estabelecimento, Entregador]
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q rota-lanches-projeto-testado-v0.2.1.zip -d projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK preinstalado
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK debug
        working-directory: projeto/android/${{ matrix.app }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Validar APK gerado
        run: |
          test -s "projeto/android/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "projeto/android/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk"
      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: APK-Rota-Lanches-${{ matrix.app }}-0.2.1
          path: projeto/android/${{ matrix.app }}/app/build/outputs/apk/debug/app-debug.apk

  teste-emulador:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'APK-Rota-Lanches-*-0.2.1'
          path: apks
      - name: Liberar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e iniciar os dois APKs no Android simulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euxo pipefail
            mkdir -p screenshots
            adb install apks/APK-Rota-Lanches-Estabelecimento-0.2.1/app-debug.apk
            adb shell am start -W -n br.com.rotalanches.loja/br.com.rotalanches.MainActivity
            sleep 5
            adb shell pidof br.com.rotalanches.loja | grep -E '^[0-9]+$'
            adb exec-out screencap -p > screenshots/Estabelecimento.png
            adb shell am force-stop br.com.rotalanches.loja
            adb install apks/APK-Rota-Lanches-Entregador-0.2.1/app-debug.apk
            adb shell am start -W -n br.com.rotalanches.entregador/br.com.rotalanches.MainActivity
            sleep 5
            adb shell pidof br.com.rotalanches.entregador | grep -E '^[0-9]+$'
            adb exec-out screencap -p > screenshots/Entregador.png
      - name: Guardar capturas do Android simulado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas-emulador-Android-RotaLanches
          path: screenshots/*.png
