name: Compilar Banco Amigos V5 Usuario e Admin
on:
  push:
    branches: [banco-amigos-v5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar projeto V1 V2 V3
        shell: bash
        run: |
          cat bundle/banco-source.b64.part1 bundle/banco-source.b64.part2 bundle/banco-source.b64.part3a bundle/banco-source.b64.part3b bundle/banco-source.b64.part4a bundle/banco-source.b64.part4b bundle/banco-source.b64.part5a bundle/banco-source.b64.part5b | base64 --decode > /tmp/v1.tar.xz
          echo '2f191ac959836c3cef4aa7967394611dfe06d3d72a42ccf1cf9c7e153a5a1a56  /tmp/v1.tar.xz' | sha256sum --check
          rm -rf app admin
          rm -f build.gradle.kts settings.gradle.kts
          tar -xJf /tmp/v1.tar.xz
          cat bundle/banco-v2-patch.part* | base64 --decode > /tmp/v2.tar.xz
          echo 'ade6199897f8a2f4278145eebd1670eeafb4ac968fd0fde29aa9576bf467c1a4  /tmp/v2.tar.xz' | sha256sum --check
          tar -xJf /tmp/v2.tar.xz
          patch --batch -p1 < v2.patch
          cat bundle/nfc-v3-patch.part* | base64 --decode > /tmp/v3.patch.xz
          echo '32738556fac0b958958505a5bebb8dcad6cfc3f360b647377955359a832ab2a9  /tmp/v3.patch.xz' | sha256sum --check
          xz -d -c /tmp/v3.patch.xz > /tmp/v3.patch
          patch --batch -p1 < /tmp/v3.patch
      - name: Adicionar cadastro online tres chaves e app administrativo V5
        shell: bash
        run: |
          cat bundle/v5-mini.part* | base64 --decode > /tmp/v5-mini.tar.xz
          echo 'd00cc3cc1267a0b1813bcd1e52f18b47497156d6a62dd82146c924b47f2695e7  /tmp/v5-mini.tar.xz' | sha256sum --check
          tar -xJf /tmp/v5-mini.tar.xz
          patch --batch -p1 < main.diff
          test -f app/src/main/java/br/com/bancoamigos/OnlinePanel.java
          test -f admin/src/main/java/br/com/bancoamigos/admin/AdminActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APKs
        run: gradle --no-daemon :app:assembleDebug :admin:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Banco-Amigos-V5-Usuario
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Banco-Amigos-V5-Administrador
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 30
