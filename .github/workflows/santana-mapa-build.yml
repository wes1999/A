name: Compilar APK Santana
on:
  push:
    branches: [santana-mapa-2026]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShapedSantana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Dados offline OSM
        continue-on-error: true
        run: python3 scripts/fetch_osm.py
      - name: Preparar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar Android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SantanaMapaRuas-APK
          path: ShapedSantana/app/build/outputs/apk/debug/app-debug.apk
