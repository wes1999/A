name: Build RAM Limpar Agressivo APK
on:
  push:
    branches: [ram-cleaner-shizuku]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source and build APK
        run: |
          base64 -d ram_cleaner_source.tar.b64 | tar -xz
          cd RAM_Limpar_Agressivo_S24
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Limpar-Agressivo-S24
          path: RAM_Limpar_Agressivo_S24/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
