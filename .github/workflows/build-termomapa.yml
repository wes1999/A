name: Compilar TermoMapa Brasil
on:
  push:
    branches: [termomapa-s24-android]
    paths:
      - 'termomapa/**'
      - '.github/workflows/build-termomapa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Converter malha oficial IBGE 2025 e RA do DF
        run: |
          python -m pip install --upgrade pip
          pip install requests pyshp shapely
          python termomapa/tools/prepare_geodata.py
      - name: Empacotar bibliotecas locais do mapa
        run: |
          mkdir -p termomapa/app/src/main/assets/vendor
          curl -fL --retry 3 -o termomapa/app/src/main/assets/vendor/leaflet.js https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js
          curl -fL --retry 3 -o termomapa/app/src/main/assets/vendor/leaflet.css https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css
          curl -fL --retry 3 -o termomapa/app/src/main/assets/vendor/shp.js https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle -p termomapa --no-daemon assembleDebug
      - name: Preparar arquivo instalável
        run: cp termomapa/app/build/outputs/apk/debug/app-debug.apk TermoMapaBrasil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TermoMapaBrasil-APK
          path: TermoMapaBrasil.apk
          retention-days: 30
      - name: Publicar APK instalável em release de teste
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete termomapa-preview --yes >/dev/null 2>&1 || true
          gh release create termomapa-preview TermoMapaBrasil.apk --title "TermoMapa Brasil — APK experimental" --notes "Compilação experimental da branch mapa-temperatura-brasil. Uso pessoal; confira as notas no README." --target "$GITHUB_SHA" --prerelease
