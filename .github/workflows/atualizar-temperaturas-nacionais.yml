name: Atualizar temperaturas de TODOS os municípios e RAs do DF

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-temperaturas-nacionais.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: snapshot-temperaturas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo do aplicativo
        uses: actions/checkout@v4
        with:
          ref: mapa-temperatura-brasil
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar decodificador meteorologico
        run: python -m pip install --no-cache-dir numpy requests eccodes shapely==2.1.2
      - name: Recuperar cadastro de TODOS os territorios do APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mapa-apk
          gh release download mapa-temperatura-v3 -R "${GITHUB_REPOSITORY}" -p "MapaTemperaturasBrasil-V3-ZoomFixo.apk" -D /tmp/mapa-apk
          test -s /tmp/mapa-apk/MapaTemperaturasBrasil-V3-ZoomFixo.apk
      - name: Baixar grade de temperatura GFS e amostrar todos os territorios
        env:
          APK_PATH: /tmp/mapa-apk/MapaTemperaturasBrasil-V3-ZoomFixo.apk
        run: |
          python temperature_backend/make_snapshot.py
          test -s data/temperaturas.json
          test -s data/pontos.json
          cp data/temperaturas.json /tmp/temperaturas-nacionais.json
          cp data/pontos.json /tmp/pontos-nacionais.json
      - name: Publicar fotografia nacional unica
        run: |
          git fetch origin dados-temperaturas
          git checkout -B dados-temperaturas origin/dados-temperaturas
          mkdir -p data
          cp /tmp/temperaturas-nacionais.json data/temperaturas.json
          cp /tmp/pontos-nacionais.json data/pontos.json
          git config user.name "Mapa Temperaturas Brasil"
          git config user.email "actions@users.noreply.github.com"
          git add data/temperaturas.json data/pontos.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de dados"
          else
            git commit -m "Atualizar 5.569 municípios, 37 RAs e Noronha (GFS + METAR)"
            git push origin HEAD:refs/heads/dados-temperaturas
          fi
# Verificação de integração GRIB corrigida
