name: Compilar Mapa Temperaturas Brasil
on:
  push:
    branches: [mapa-temperatura-brasil]
    paths:
      - 'mapa-temperatura-brasil/**'
      - '.github/workflows/build-mapa-temperatura.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar dependências geográficas
        run: pip install --no-cache-dir shapely==2.1.2 pyshp==2.3.1 requests==2.32.3 pyproj==3.7.1
      - name: Processar base oficial IBGE e polígonos do DF
        run: python mapa-temperatura-brasil/tools/build_geo.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Empacotar biblioteca Leaflet localmente (funciona sem CDN no telefone)
        run: |
          curl -fL --retry 4 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o mapa-temperatura-brasil/app/src/main/assets/leaflet.js
          curl -fL --retry 4 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o mapa-temperatura-brasil/app/src/main/assets/leaflet.css
      - name: Embutir fotografia nacional completa de temperaturas no APK
        run: |
          curl -fLsS --retry 5 --retry-delay 2 "https://raw.githubusercontent.com/wes1999/A/dados-temperaturas/data/temperaturas.json" -o mapa-temperatura-brasil/app/src/main/assets/temperaturas_inicial.json
          python3 -c 'import json; p="mapa-temperatura-brasil/app/src/main/assets/temperaturas_inicial.json"; a=json.load(open(p)); assert a["municipios"]==5569 and a["regioes_administrativas_df"]==37 and len(a["values"])==5607'
      - name: Validar sintaxe JavaScript do mapa
        run: node --check mapa-temperatura-brasil/app/src/main/assets/app.js
      - name: Compilar APK Android
        run: cd mapa-temperatura-brasil && gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MapaTemperaturaBrasil-APK
          path: mapa-temperatura-brasil/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
