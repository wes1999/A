name: Compilar Astro S24 APK
on:
  push:
    branches: [build-astro-s24]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android do runner
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Gerar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AstroS24-Instalavel
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK direto
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create astro-s24-v1.0.0 app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "Astro S24 v1.0.0" --notes "APK Android de astrofotografia; exposição acumulada de 10/20/30 minutos. Experimental."
