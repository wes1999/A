name: Build Calendário Acelerado APK

on:
  push:
    paths:
      - 'CalendarioAcelerado/**'
      - '.github/workflows/calendario-acelerado-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: CalendarioAcelerado
        run: gradle --no-daemon assembleDebug

      - name: Publish APK as a downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calendario-acelerado-v1.0-${{ github.run_number }}
          name: Calendário Acelerado APK v1.0 (build ${{ github.run_number }})
          body: |
            APK de teste do Calendário Acelerado.
            Instalação: baixe o arquivo APK no Android e autorize a instalação desta fonte, se solicitado.
            Observação: a compilação automatizada não substitui o teste físico no aparelho.
          files: CalendarioAcelerado/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
