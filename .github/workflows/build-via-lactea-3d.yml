name: Via Láctea 3D - APK
on:
  push:
    branches: [via-lactea-3d]
    paths:
      - 'via-lactea-3d/**'
      - '.github/workflows/build-via-lactea-3d.yml'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar plataforma Android 35
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK Android
        working-directory: via-lactea-3d
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK instalável
        uses: actions/upload-artifact@v4
        with:
          name: ViaLactea3D-APK
          path: via-lactea-3d/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
