name: Compilar Astro S24

on:
  push:
    branches: [main, astro-s24]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar código do aplicativo
        shell: bash
        run: |
          echo "Usando projeto astro-s24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK do runner
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testes do filtro
        working-directory: astro-s24
        run: gradle --no-daemon testDebugUnitTest

      - name: Gerar APK
        working-directory: astro-s24
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: AstroS24-APK
          path: astro-s24/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar fontes no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties build.gradle.kts settings.gradle.kts app/build.gradle.kts app/src/
          if ! git diff --cached --quiet; then
            git commit -m "Publica fontes Pop 110 Digital V2"
            git push
          fi
