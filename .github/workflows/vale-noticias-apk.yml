name: Vale Noticias APK
on:
  push:
    branches: [vale-noticias-2026]
    paths:
      - 'ValeNoticias/**'
      - '.github/workflows/vale-noticias-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ValeNoticias
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ValeNoticias-APK
          path: ValeNoticias/app/build/outputs/apk/debug/app-debug.apk
      - name: Make APK accessible for direct download
        run: |
          cp ValeNoticias/app/build/outputs/apk/debug/app-debug.apk ValeDoAcoNoticias.apk
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ValeDoAcoNoticias.apk
          git commit -m "Publish compiled Vale Noticias APK" || exit 0
          git push
