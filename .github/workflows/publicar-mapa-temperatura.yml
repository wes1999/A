name: Publicar APK V6 com temperatura METAR observada
on:
  push:
    branches: [mapa-temperatura-brasil]
    paths:
      - '.github/workflows/publicar-mapa-temperatura.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar APK da compilacao validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42536952202 -R "${GITHUB_REPOSITORY}" -n MapaTemperaturaBrasil-APK -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/MapaTemperaturasBrasil-V6-Observacoes-Reais.apk
          file dist/MapaTemperaturasBrasil-V6-Observacoes-Reais.apk
          sha256sum dist/MapaTemperaturasBrasil-V6-Observacoes-Reais.apk
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mapa-temperatura-v6 dist/MapaTemperaturasBrasil-V6-Observacoes-Reais.apk \
            -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mapa de Temperaturas do Brasil V6 - Observações reais quando disponíveis" \
            --notes "APK Android V6: 5.569 municípios, 37 regiões administrativas do DF e Fernando de Noronha. Observações de estações aeroportuárias METAR reais quando existentes no território e recentes; o restante das temperaturas continua sendo estimativa GFS (25 km). Fontes claramente identificadas ao tocar no município. Atualização nacional aproximadamente de hora em hora. Não coleta dados da Weather.com; o serviço requer API autorizada. Ainda precisa ser testado no Galaxy S24." \
            --latest=false
