name: Publicar APK V5 com fronteiras detalhadas
on:
  push:
    branches: [mapa-temperatura-brasil]
    paths:
      - '.github/workflows/publicar-mapa-temperatura.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar APK da compilacao validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42535327062 -R "${GITHUB_REPOSITORY}" -n MapaTemperaturaBrasil-APK -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/MapaTemperaturasBrasil-V5-Fronteiras-Detalhadas.apk
          file dist/MapaTemperaturasBrasil-V5-Fronteiras-Detalhadas.apk
          sha256sum dist/MapaTemperaturasBrasil-V5-Fronteiras-Detalhadas.apk
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mapa-temperatura-v5 dist/MapaTemperaturasBrasil-V5-Fronteiras-Detalhadas.apk \
            -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mapa de Temperaturas do Brasil V5 - Fronteiras detalhadas" \
            --notes "APK Android V5: malha IBGE 2025 muito mais detalhada em zoom nacional e local, contornos menos simplificados e sem sobreposição de camadas. Mantém temperaturas GFS e 5.569 municípios + 37 regiões administrativas do DF. Ainda não testado em Galaxy S24, e o DF usa malha provisória." \
            --latest=false
