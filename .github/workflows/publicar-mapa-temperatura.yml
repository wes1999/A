name: Publicar APK V4 com 5606 territorios
on:
  push:
    branches: [mapa-temperatura-brasil]
    paths:
      - '.github/workflows/publicar-mapa-temperatura.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar APK da compilacao validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42532617049 -R "${GITHUB_REPOSITORY}" -n MapaTemperaturaBrasil-APK -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/MapaTemperaturasBrasil-V4-5606-Territorios.apk
          file dist/MapaTemperaturasBrasil-V4-5606-Territorios.apk
          sha256sum dist/MapaTemperaturasBrasil-V4-5606-Territorios.apk
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mapa-temperatura-v4 dist/MapaTemperaturasBrasil-V4-5606-Territorios.apk \
            -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mapa de Temperaturas do Brasil V4 - Todos os municípios e RAs" \
            --notes "APK Android V4: 5.569 municípios + 37 regiões administrativas do DF, atualizados numa fotografia nacional única usando temperatura estimada NOAA GFS (0,25 grau). Cores idênticas em qualquer zoom. Inclui Fernando de Noronha. Ainda requer teste no aparelho; a malha do DF usa dados públicos provisórios e não o arquivo original ajustado." \
            --latest=false
