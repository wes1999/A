name: Publicar APK V3 com Cores Fixas
on:
  push:
    branches: [mapa-temperatura-brasil]
    paths:
      - '.github/workflows/publicar-mapa-temperatura.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar APK da compilacao validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42530553829 -R "${GITHUB_REPOSITORY}" -n MapaTemperaturaBrasil-APK -D dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/MapaTemperaturasBrasil-V3-ZoomFixo.apk
          file dist/MapaTemperaturasBrasil-V3-ZoomFixo.apk
          sha256sum dist/MapaTemperaturasBrasil-V3-ZoomFixo.apk
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mapa-temperatura-v3 dist/MapaTemperaturasBrasil-V3-ZoomFixo.apk \
            -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mapa de Temperaturas do Brasil V3 - Cores Fixas" \
            --notes "APK Android V3: cores constantes em qualquer zoom, atualização meteorológica independente do zoom, melhorias nas consultas nacionais e regiões administrativas do DF. Ainda requer testes no aparelho e ajustes finais nos limites originais do DF." \
            --latest=false
