name: Build Astro S24
on:
  push:
    branches: [ astro-s24 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-s24
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astro-s24-debug
          path: astro-s24/app/build/outputs/apk/debug/app-debug.apk
