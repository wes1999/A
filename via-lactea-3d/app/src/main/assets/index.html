<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#030713"/>
<title>Via Láctea 3D</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<canvas id="sky" aria-label="Visualização interativa tridimensional da Via Láctea"></canvas>
<div id="earthBall" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>
<header class="header">
  <div class="brand"><span class="symbol">✦</span><div><strong>VIA LÁCTEA <em>3D</em></strong><small>EXPLORADOR CÓSMICO</small></div></div>
  <button id="reset" class="reset" title="Voltar à galáxia">↺</button>
</header>
<div id="error" role="status"></div>
<aside class="hint">Arraste para girar • Afaste ou aproxime dois dedos para mudar o zoom</aside>
<section class="control" aria-label="Controles astronômicos">
  <div class="stats"><div><div class="stat-label">REGIÃO ATUAL</div><div id="level" class="stat-value">VIA LÁCTEA</div></div><div class="align-right"><div class="stat-label">DISTÂNCIA DA CÂMERA</div><div id="distance" class="stat-value">—</div></div></div>
  <div class="range-title"><span>APROXIMAR</span><span>AFASTAR</span></div>
  <input type="range" id="zoom" min="-4.30" max="10.38" value="10.18" step="0.01" aria-label="Zoom astronômico" />
  <div class="places">
    <button data-place="9.92">✦ <span>Galáxia</span></button>
    <button data-place="2.1">☀ <span>Sol</span></button>
    <button data-place="-3.92">◉ <span>Terra</span></button>
  </div>
  <div class="options">
    <label>Estrelas <select id="stars"><option value="35000">35 mil</option><option value="70000" selected>70 mil</option><option value="132000">132 mil</option></select></label>
    <label>Limite <select id="fps"><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label>
  </div>
  <p id="tip" class="footnote">Pontos simulados para representar a estrutura da galáxia</p>
  <p class="source">Dados locais • Sem internet • Estrutura galáctica aproximada</p>
</section>
<script src="engine.js"></script>
</body>
</html>
